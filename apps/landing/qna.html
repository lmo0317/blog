<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>질문 게시판 — 이웃메이트</title>
<meta name="description" content="이웃메이트 설치, 사용법, 구독에 대해 궁금한 점을 남겨 주세요. 제작자가 직접 답변합니다.">
<meta property="og:title" content="질문 게시판 — 이웃메이트">
<meta property="og:description" content="설치, 사용법, 구독 무엇이든 물어보세요. 제작자가 직접 답변합니다.">
<meta property="og:image" content="https://minohlee.mooo.com/neighbormate-app/assets/autopilot.webp">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/site.css?v=20261012">
</head>
<body class="board-body">

<header class="top">
  <div class="wrap">
    <a class="brand" href="./"><span class="brand-mark">N</span>이웃메이트</a>
    <nav class="nav" aria-label="사이트 메뉴">
      <a href="./">홈</a>
      <a href="about.html">기능 소개</a>
      <a href="qna.html" aria-current="page">질문 게시판</a>
    </nav>
    <a class="btn btn-primary btn-sm" href="https://minohlee.mooo.com/updates/neighbormate/NeighborMate-Setup.exe">무료 체험</a>
  </div>
</header>

<main class="board-main">
  <div class="wrap board-wrap">
    <div class="board-title">
      <div>
        <h1><a href="qna.html" data-nav="list">💬 질문 게시판</a></h1>
        <p>설치, 사용법, 구독까지 무엇이든 물어보세요. 제작자가 직접 답변합니다.</p>
      </div>
      <a class="kakao-btn" href="https://open.kakao.com/o/sxZ1kQRi" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3C6.48 3 2 6.53 2 10.9c0 2.82 1.87 5.3 4.69 6.7l-.96 3.53c-.08.31.27.56.54.38l4.2-2.78c.5.06 1.01.09 1.53.09 5.52 0 10-3.53 10-7.92S17.52 3 12 3z"/></svg>카카오톡 1:1 문의</a>
    </div>

    <!-- List -->
    <section id="listView" hidden>
      <div class="board-bar">
        <span class="board-count" id="boardCount"></span>
        <button class="btn btn-primary btn-md" type="button" data-nav="write">✏️ 글쓰기</button>
      </div>
      <table class="board-table">
        <colgroup><col class="c-no"><col><col class="c-name"><col class="c-date"><col class="c-views"></colgroup>
        <thead><tr><th scope="col">번호</th><th scope="col">제목</th><th scope="col">작성자</th><th scope="col">작성일</th><th scope="col">조회</th></tr></thead>
        <tbody id="boardRows"></tbody>
      </table>
      <nav class="pager" id="pager" aria-label="페이지"></nav>
      <form class="board-search" id="searchForm" role="search">
        <select class="select" id="searchField" aria-label="검색 범위">
          <option value="all">제목+내용</option>
          <option value="title">제목</option>
          <option value="nickname">작성자</option>
        </select>
        <input class="input" id="searchInput" type="search" maxlength="40" placeholder="검색어를 입력하세요" aria-label="검색어">
        <button class="btn btn-dark btn-md" type="submit">검색</button>
      </form>
    </section>

    <!-- Post -->
    <section id="postView" hidden>
      <article class="post" id="post"></article>
      <div class="post-actions">
        <button class="btn btn-ghost btn-md" type="button" data-nav="list">☰ 목록</button>
        <div class="post-actions-right">
          <button class="btn btn-ghost btn-md" type="button" id="deleteBtn">삭제</button>
          <button class="btn btn-primary btn-md" type="button" data-nav="write">✏️ 글쓰기</button>
        </div>
      </div>
      <form class="pw-row" id="deleteForm" hidden>
        <span>질문을 지우려면 글을 쓸 때 정한 비밀번호를 입력해 주세요.</span>
        <input class="input" type="password" id="deletePass" placeholder="비밀번호" aria-label="비밀번호" autocomplete="current-password">
        <button class="btn btn-danger btn-md" type="submit">삭제</button>
        <button class="btn btn-ghost btn-md" type="button" id="deleteCancel">취소</button>
        <em class="err" id="deleteErr"></em>
      </form>
      <table class="post-nav" id="postNav"></table>
    </section>

    <!-- Write -->
    <section id="writeView" hidden>
      <form class="write" id="writeForm" novalidate>
        <h2 class="write-title">✏️ 질문 쓰기</h2>
        <div class="write-row">
          <label for="fNick">작성자</label>
          <div><input class="input" id="fNick" maxlength="20" autocomplete="nickname" placeholder="닉네임"></div>
        </div>
        <div class="write-row">
          <label for="fPass">비밀번호</label>
          <div><input class="input" id="fPass" type="password" maxlength="64" autocomplete="new-password" placeholder="4자 이상"><span class="hint">비밀글을 열거나 질문을 지울 때 써요.</span></div>
        </div>
        <div class="write-row">
          <label for="fTitle">제목</label>
          <div><input class="input wide" id="fTitle" maxlength="80" placeholder="예: 노트북에서도 로컬 AI가 돌아가나요?"></div>
        </div>
        <div class="write-row">
          <span class="label">공개 설정</span>
          <div>
            <label class="option-card">
              <input type="checkbox" id="fPrivate">
              <span class="option-icon">🔒</span>
              <span class="option-content">
                <span class="option-title">비밀글로 올리기</span>
                <span class="option-desc">나와 제작자만 볼 수 있어요. 결제·계정 문의에 써 주세요.</span>
              </span>
            </label>
          </div>
        </div>
        <div class="write-row top">
          <label for="fBody">내용</label>
          <div>
            <textarea class="textarea" id="fBody" maxlength="3000" placeholder="궁금한 점을 편하게 적어 주세요. 사용 중인 PC 사양이나 화면에 뜬 문구를 함께 적어 주시면 더 정확히 답변드릴 수 있어요."></textarea>
            <span class="count" id="bodyCount">0 / 3000</span>
          </div>
        </div>
        <div class="hp" aria-hidden="true"><label>웹사이트 <input id="fSite" tabindex="-1" autocomplete="off"></label></div>
        <div class="form-error" id="formError" role="alert"></div>
        <div class="write-actions">
          <button class="btn btn-ghost btn-md" type="button" data-nav="list">취소</button>
          <button class="btn btn-primary btn-md" type="submit" id="submitBtn">등록</button>
        </div>
      </form>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 이웃메이트 · 네이버와 제휴하지 않은 독립 소프트웨어입니다.</span>
    <span class="foot-links"><a href="./">홈</a><a href="about.html">기능 소개</a><a href="qna.html">질문 게시판</a><a href="https://open.kakao.com/o/sxZ1kQRi" target="_blank" rel="noopener">카톡 문의</a></span>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const API = '/license/api/qna';
  const $ = (s, root = document) => root.querySelector(s);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const shortDate = (iso) => {
    const d = new Date(iso), now = new Date();
    return d.toDateString() === now.toDateString() ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
  };
  const fullDate = (iso) => { const d = new Date(iso); return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const isNew = (iso) => Date.now() - new Date(iso).getTime() < 24 * 60 * 60 * 1000;

  const NOTICE = {
    title: '질문 게시판 이용 안내',
    date: '2026-10-11T09:00:00+09:00',
    body: [
      '이웃메이트 질문 게시판입니다. 설치, 사용법, 구독, 오류 무엇이든 편하게 물어보세요.',
      '',
      '■ 질문 전에',
      '· 기능 소개 페이지의 자주 묻는 질문에 이미 답이 있을 수 있어요.',
      '· 앱 안의 [사용 방법] 버튼에도 메뉴별 설명이 있습니다.',
      '',
      '■ 질문할 때',
      '· 사용 중인 PC 사양(그래픽카드, 메모리)과 앱 버전(상단 v1.0.x)을 적어 주세요.',
      '· 오류라면 화면에 뜬 문구를 그대로 적어 주시면 더 빨리 답변드릴 수 있어요.',
      '· 결제·계정·이메일처럼 남이 보면 안 되는 내용은 꼭 비밀글로 올려 주세요.',
      '· 빠른 답이 필요하면 카카오톡 오픈채팅(https://open.kakao.com/o/sxZ1kQRi)으로 물어보셔도 됩니다.',
      '',
      '■ 비밀번호',
      '· 글을 쓸 때 정한 비밀번호로 비밀글을 열고, 내 질문을 지울 수 있어요.',
      '· 비밀번호는 다시 찾을 수 없으니 잊지 않게 정해 주세요.',
      '',
      '광고, 욕설, 개인정보가 담긴 글은 예고 없이 지울 수 있습니다.'
    ].join('\n')
  };

  const state = { page: 1, q: '', field: 'all' };
  const passwords = new Map(); // id -> password typed in this tab
  let current = null;          // question shown in the post view

  let toastTimer;
  function toast(message, error = false) {
    const el = $('#toast');
    el.textContent = message;
    el.className = `toast show${error ? ' error' : ''}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'toast'; }, 2800);
  }

  async function call(path, { method = 'GET', body } = {}) {
    try {
      const res = await fetch(`${API}${path}`, {
        method, cache: 'no-store',
        headers: body ? { 'Content-Type': 'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined
      });
      return await res.json();
    } catch {
      return { ok: false, message: '서버와 연결하지 못했습니다. 잠시 뒤 다시 시도해 주세요.' };
    }
  }

  // ---- Routing: ?page=&q=&field= (list) · ?id= (post) · ?notice=1 · ?write=1 ----
  function go(params, replace = false) {
    const qs = new URLSearchParams(Object.entries(params).filter(([, v]) => v !== '' && v != null));
    const url = `qna.html${qs.toString() ? `?${qs}` : ''}`;
    history[replace ? 'replaceState' : 'pushState'](null, '', url);
    route();
  }
  const listParams = () => ({ page: state.page > 1 ? state.page : '', q: state.q, field: state.q && state.field !== 'all' ? state.field : '' });

  function show(view) {
    for (const id of ['listView', 'postView', 'writeView']) $(`#${id}`).hidden = id !== view;
    window.scrollTo({ top: 0 });
  }

  function route() {
    const p = new URLSearchParams(location.search);
    if (p.get('write')) return showWrite();
    if (p.get('notice')) return showNotice();
    if (p.get('id')) return showPost(Number(p.get('id')));
    state.page = Math.max(1, Number(p.get('page')) || 1);
    state.q = p.get('q') || '';
    state.field = p.get('field') || 'all';
    showList();
  }
  window.addEventListener('popstate', route);

  document.addEventListener('click', (e) => {
    const nav = e.target.closest('[data-nav]');
    if (nav) {
      e.preventDefault();
      if (nav.dataset.nav === 'write') go({ write: 1 });
      else if (nav.dataset.nav === 'list') go(listParams());
      return;
    }
    const link = e.target.closest('a[data-id], a[data-notice]');
    if (link && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
      e.preventDefault();
      go(link.dataset.notice ? { notice: 1 } : { id: link.dataset.id });
    }
  });

  // ---- List ----
  const titleCell = (q) => {
    const status = `<span class="tag ${q.answered ? 'done' : 'wait'}">${q.answered ? '답변완료' : '답변대기'}</span>`;
    const title = q.isPrivate ? '<span class="locked">🔒 비밀글입니다</span>' : esc(q.title);
    return `<a href="qna.html?id=${q.id}" data-id="${q.id}">${status}<span class="t">${title}</span>${isNew(q.createdAt) ? '<span class="new" title="새 글">N</span>' : ''}</a>`;
  };

  async function showList() {
    show('listView');
    $('#searchInput').value = state.q;
    $('#searchField').value = state.field;
    const rows = $('#boardRows');
    rows.innerHTML = '<tr class="loading"><td colspan="5">질문을 불러오는 중…</td></tr>';
    const qs = new URLSearchParams({ page: state.page });
    if (state.q) { qs.set('q', state.q); qs.set('field', state.field); }
    const res = await call(`?${qs}`);
    if (!res.ok) {
      $('#boardCount').textContent = '';
      rows.innerHTML = `<tr class="empty"><td colspan="5">${esc(res.message || '질문 목록을 불러오지 못했습니다.')}</td></tr>`;
      $('#pager').innerHTML = '';
      return;
    }
    state.page = res.page;
    $('#boardCount').innerHTML = state.q
      ? `‘${esc(state.q)}’ 검색 결과 <b>${res.total.toLocaleString()}</b>건 <button class="link-btn" type="button" data-all>전체 보기</button>`
      : `전체 <b>${res.total.toLocaleString()}</b>건`;
    const notice = state.q || state.page > 1 ? '' : `<tr class="notice">
      <td class="no"><span class="tag notice-tag">공지</span></td>
      <td class="title"><a href="qna.html?notice=1" data-notice="1"><span class="tag notice-tag">공지</span><span class="t">${NOTICE.title}</span></a></td>
      <td class="name">이웃메이트</td><td class="date">${shortDate(NOTICE.date)}</td><td class="views">-</td></tr>`;
    const body = res.items.map((q, i) => `<tr>
      <td class="no">${res.total - (res.page - 1) * res.pageSize - i}</td>
      <td class="title">${titleCell(q)}</td>
      <td class="name">${esc(q.nickname)}</td>
      <td class="date">${shortDate(q.createdAt)}</td>
      <td class="views">${q.views.toLocaleString()}</td>
    </tr>`).join('');
    const empty = res.items.length ? '' : `<tr class="empty"><td colspan="5">${state.q ? '검색 결과가 없습니다.' : '아직 올라온 질문이 없습니다. 첫 질문을 남겨 주세요!'}</td></tr>`;
    rows.innerHTML = notice + body + empty;
    renderPager(res.pages);
  }

  $('#listView').addEventListener('click', (e) => {
    if (e.target.closest('[data-all]')) { state.q = ''; state.page = 1; go({}); }
  });

  function renderPager(pages) {
    const pager = $('#pager');
    if (pages <= 1) { pager.innerHTML = ''; return; }
    const block = Math.floor((state.page - 1) / 10) * 10;
    const nums = [];
    for (let n = block + 1; n <= Math.min(block + 10, pages); n++) nums.push(n);
    const btn = (n, label, aria, disabled) => `<button type="button" data-page="${n}" ${disabled ? 'disabled' : ''} aria-label="${aria}">${label}</button>`;
    pager.innerHTML = btn(1, '«', '첫 페이지', state.page === 1) + btn(state.page - 1, '‹', '이전 페이지', state.page === 1)
      + nums.map((n) => `<button type="button" data-page="${n}" ${n === state.page ? 'aria-current="page"' : ''}>${n}</button>`).join('')
      + btn(state.page + 1, '›', '다음 페이지', state.page === pages) + btn(pages, '»', '마지막 페이지', state.page === pages);
  }
  $('#pager').addEventListener('click', (e) => {
    const b = e.target.closest('[data-page]');
    if (!b || b.disabled) return;
    state.page = Number(b.dataset.page);
    go(listParams());
  });

  $('#searchForm').addEventListener('submit', (e) => {
    e.preventDefault();
    state.q = $('#searchInput').value.trim();
    state.field = $('#searchField').value;
    state.page = 1;
    go(listParams());
  });

  // ---- Post ----
  function postHead(q, { notice = false } = {}) {
    const tag = notice ? '<span class="tag notice-tag">공지</span>' : `<span class="tag ${q.answered || q.answer ? 'done' : 'wait'}">${q.answered || q.answer ? '답변완료' : '답변대기'}</span>`;
    const title = q.title ? esc(q.title) : '🔒 비밀글입니다';
    return `<header class="post-head">
        <h2>${tag}${q.isPrivate && q.title ? '🔒 ' : ''}${title}</h2>
        <div class="post-meta"><span><b>${esc(q.nickname)}</b></span><span>${fullDate(q.createdAt)}</span>${notice ? '' : `<span>조회 ${Number(q.views || 0).toLocaleString()}</span>`}</div>
      </header>`;
  }

  function answerHtml(q) {
    if (!q.answer) return '<section class="answers"><h3>답변 <b>0</b></h3><p class="answer-wait">⏳ 답변을 준비하고 있어요. 답변이 달리면 여기에 바로 보입니다.</p></section>';
    return `<section class="answers"><h3>답변 <b>1</b></h3>
      <div class="answer"><div class="answer-who"><span class="brand-mark">N</span><b>이웃메이트</b><span class="tag admin">제작자</span><time>${fullDate(q.answeredAt)}</time></div>
      <p>${esc(q.answer)}</p></div></section>`;
  }

  function navHtml(prev, next) {
    const row = (label, q) => `<tr><th scope="row">${label}</th><td>${q
      ? `<a href="qna.html?id=${q.id}" data-id="${q.id}">${q.isPrivate ? '🔒 비밀글입니다' : esc(q.title)}</a>`
      : `<span class="none">${label === '▲ 다음글' ? '다음 글이 없습니다' : '이전 글이 없습니다'}</span>`}</td></tr>`;
    return row('▲ 다음글', next) + row('▼ 이전글', prev);
  }

  function renderPost(q, prev, next) {
    current = q;
    $('#post').innerHTML = `${postHead(q)}<div class="post-body">${esc(q.body)}</div>${answerHtml(q)}`;
    $('#postNav').innerHTML = navHtml(prev, next);
    $('#deleteBtn').hidden = false;
  }

  async function showPost(id) {
    show('postView');
    resetDelete();
    $('#post').innerHTML = '<div class="post-loading">질문을 불러오는 중…</div>';
    $('#postNav').innerHTML = '';
    const known = passwords.get(id);
    const res = known ? await call(`/${id}/open`, { method: 'POST', body: { password: known } }) : await call(`/${id}`);
    if (res.ok) return renderPost(res.question, res.prev, res.next);
    if (res.error === 'PRIVATE') {
      current = res.question;
      $('#post').innerHTML = `${postHead(res.question)}
        <form class="lock-box" id="lockForm">
          <span class="lock-ico">🔒</span>
          <b>비밀글입니다</b>
          <p>질문을 올릴 때 정한 비밀번호를 입력하면 볼 수 있어요.</p>
          <div class="lock-row"><input class="input" type="password" id="lockPass" placeholder="비밀번호" aria-label="비밀번호" autocomplete="current-password"><button class="btn btn-primary btn-md" type="submit">확인</button></div>
          <em class="err" id="lockErr"></em>
        </form>`;
      $('#postNav').innerHTML = navHtml(res.prev, res.next);
      $('#deleteBtn').hidden = false;
      $('#lockPass').focus();
      return;
    }
    current = null;
    $('#post').innerHTML = `<div class="post-missing"><b>${esc(res.message || '질문을 불러오지 못했습니다.')}</b><p>목록에서 다른 질문을 확인해 주세요.</p></div>`;
    $('#deleteBtn').hidden = true;
  }

  $('#post').addEventListener('submit', async (e) => {
    if (e.target.id !== 'lockForm') return;
    e.preventDefault();
    const password = $('#lockPass').value;
    if (!password) { $('#lockErr').textContent = '비밀번호를 입력해 주세요.'; return; }
    const res = await call(`/${current.id}/open`, { method: 'POST', body: { password } });
    if (!res.ok) { $('#lockErr').textContent = res.message || '열지 못했습니다.'; $('#lockPass').select(); return; }
    passwords.set(current.id, password);
    renderPost(res.question, res.prev, res.next);
  });

  function showNotice() {
    show('postView');
    resetDelete();
    current = null;
    $('#post').innerHTML = `${postHead({ title: NOTICE.title, nickname: '이웃메이트', createdAt: NOTICE.date }, { notice: true })}<div class="post-body">${esc(NOTICE.body)}</div>`;
    $('#postNav').innerHTML = '';
    $('#deleteBtn').hidden = true;
  }

  // ---- Delete ----
  function resetDelete() {
    $('#deleteForm').hidden = true;
    $('#deleteErr').textContent = '';
    $('#deletePass').value = '';
  }
  async function removeCurrent(password) {
    const res = await call(`/${current.id}/delete`, { method: 'POST', body: { password } });
    if (!res.ok) {
      passwords.delete(current.id);
      $('#deleteForm').hidden = false;
      $('#deleteErr').textContent = res.message || '삭제하지 못했습니다.';
      $('#deletePass').focus();
      return;
    }
    passwords.delete(current.id);
    toast('질문을 삭제했습니다.');
    go(listParams(), true);
  }
  $('#deleteBtn').addEventListener('click', () => {
    if (!current) return;
    if (passwords.has(current.id) && $('#deleteForm').hidden) {
      $('#deleteForm').hidden = false;
      $('#deletePass').value = passwords.get(current.id);
      $('#deleteErr').textContent = '';
      return;
    }
    $('#deleteForm').hidden = !$('#deleteForm').hidden;
    if (!$('#deleteForm').hidden) $('#deletePass').focus();
  });
  $('#deleteCancel').addEventListener('click', resetDelete);
  $('#deleteForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const password = $('#deletePass').value;
    if (!password) { $('#deleteErr').textContent = '비밀번호를 입력해 주세요.'; return; }
    removeCurrent(password);
  });

  // ---- Write ----
  function showWrite() {
    show('writeView');
    $('#formError').textContent = '';
    $('#fNick').focus();
  }
  $('#fBody').addEventListener('input', () => { $('#bodyCount').textContent = `${$('#fBody').value.length.toLocaleString()} / 3000`; });

  $('#writeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = {
      nickname: $('#fNick').value.trim(),
      password: $('#fPass').value,
      title: $('#fTitle').value.trim(),
      body: $('#fBody').value.trim(),
      isPrivate: $('#fPrivate').checked,
      website: $('#fSite').value
    };
    const problem = !data.nickname ? ['#fNick', '작성자(닉네임)를 입력해 주세요.']
      : data.password.length < 4 ? ['#fPass', '비밀번호는 4자 이상으로 정해 주세요.']
      : data.title.length < 2 ? ['#fTitle', '제목을 두 글자 이상 입력해 주세요.']
      : data.body.length < 5 ? ['#fBody', '내용을 다섯 글자 이상 입력해 주세요.'] : null;
    if (problem) { $('#formError').textContent = problem[1]; $(problem[0]).focus(); return; }

    const btn = $('#submitBtn');
    btn.disabled = true; btn.textContent = '등록 중…';
    const res = await call('', { method: 'POST', body: data });
    btn.disabled = false; btn.textContent = '등록';
    if (!res.ok) { $('#formError').textContent = res.message || '질문을 올리지 못했습니다. 잠시 뒤 다시 시도해 주세요.'; return; }

    passwords.set(res.question.id, data.password);
    $('#writeForm').reset();
    $('#bodyCount').textContent = '0 / 3000';
    toast('✅ 질문을 올렸습니다. 답변이 달리면 이 글에서 볼 수 있어요.');
    go({ id: res.question.id }, true);
  });

  // Old links (#q-12) open that question.
  const legacy = location.hash.match(/^#q-(\d+)$/);
  if (legacy) history.replaceState(null, '', `qna.html?id=${legacy[1]}`);
  route();
})();
</script>
